<style>
/* ── RESET ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue-900:#0d2137;--blue-800:#1a3a5c;--blue-700:#1f4d7a;--blue-600:#2563a8;
  --blue-400:#3b82c4;--blue-100:#dbeafe;--blue-50:#eff6ff;
  --red:#c0392b;--red-light:#fee2e2;
  --lv0:#8e9eab;--lv1:#e67e22;--lv2:#27ae60;--lv3:#2980b9;
  --ok:#1e8449;--crit:#c0392b;
  --grey-50:#f8f9fa;--grey-100:#f1f3f4;--grey-200:#dee2e6;
  --grey-400:#adb5bd;--grey-500:#6c757d;--grey-700:#495057;--grey-800:#343a40;
  --shadow-sm:0 1px 4px rgba(0,0,0,.10);
  --shadow:0 2px 10px rgba(0,0,0,.12);
  --shadow-lg:0 8px 30px rgba(0,0,0,.18);
  --radius:8px;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:#eef2f7;color:var(--grey-800);font-size:14px;min-height:100vh}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?

#lock-screen{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(145deg,#060f1a 0%,#0d2137 40%,#1a1a2e 70%,#16213e 100%);
  display:flex;align-items:center;justify-content:center;
  padding:1rem;
}
#lock-screen::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 50%,rgba(37,99,168,.15) 0%,transparent 60%),
             radial-gradient(ellipse at 70% 50%,rgba(155,34,38,.12) 0%,transparent 60%);
}
.lock-card{
  position:relative;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:2.5rem 2.25rem 2rem;
  width:100%;max-width:400px;
  text-align:center;
  backdrop-filter:blur(12px);
  box-shadow:0 25px 60px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05) inset;
}
.lock-logo-wrap{margin-bottom:1.5rem;display:flex;justify-content:center}
.lock-logo-wrap img{filter:drop-shadow(0 4px 16px rgba(0,0,0,.5))}
.lock-title{color:#fff;font-size:1.3rem;font-weight:800;letter-spacing:.5px;margin-bottom:.4rem}
.lock-subtitle{color:rgba(255,255,255,.45);font-size:.78rem;margin-bottom:2rem;letter-spacing:.3px}
.lock-input-wrap{position:relative;margin-bottom:.9rem}
.lock-input{
  width:100%;padding:.85rem 3rem .85rem 1.1rem;
  background:rgba(255,255,255,.07);
  border:1.5px solid rgba(255,255,255,.15);
  border-radius:10px;color:#fff;font-size:1rem;
  outline:none;letter-spacing:.1rem;text-align:center;
  transition:border-color .2s,background .2s;
  caret-color:#3b82c4;
}
.lock-input::placeholder{color:rgba(255,255,255,.3);letter-spacing:.05rem;font-size:.85rem}
.lock-input:focus{border-color:#3b82c4;background:rgba(59,130,196,.1)}
.lock-input.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.lock-eye{
  position:absolute;right:.9rem;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:rgba(255,255,255,.35);
  font-size:1.1rem;padding:.2rem;line-height:1;
  transition:color .15s;
}
.lock-eye:hover{color:rgba(255,255,255,.7)}
.lock-btn{
  width:100%;padding:.85rem;
  background:linear-gradient(135deg,var(--blue-600),var(--blue-700));
  color:#fff;border:none;border-radius:10px;
  font-size:1rem;font-weight:700;cursor:pointer;
  letter-spacing:.5px;transition:all .2s;
  box-shadow:0 4px 15px rgba(37,99,168,.4);
}
.lock-btn:hover{background:linear-gradient(135deg,var(--blue-700),var(--blue-900));transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,168,.5)}
.lock-btn:active{transform:translateY(0)}
.lock-error{
  color:#f87171;font-size:.8rem;font-weight:600;
  margin-top:.75rem;min-height:1.2rem;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.lock-footer{color:rgba(255,255,255,.2);font-size:.7rem;margin-top:2rem;letter-spacing:.5px}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?
   APP SHELL
�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
.app-shell{display:flex;flex-direction:column;min-height:100vh}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?
   HEADER
�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
.top-header{
  background:linear-gradient(135deg,var(--blue-900) 0%,var(--blue-700) 55%,#9b2226 100%);
  color:#fff;padding:1rem 1.75rem;
  display:flex;align-items:center;gap:1.25rem;
  box-shadow:0 3px 16px rgba(13,33,55,.45);
  flex-shrink:0;
}
.header-logo{flex-shrink:0;display:flex;align-items:center}
.header-logo img{filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.header-brand{display:flex;flex-direction:column;gap:.1rem}
.brand-name{font-size:1.15rem;font-weight:800;letter-spacing:.4px;line-height:1.2}
.brand-sub{font-size:.7rem;opacity:.65;text-transform:uppercase;letter-spacing:1.2px}
.header-center{flex:1;text-align:center}
.header-center h1{font-size:1.25rem;font-weight:700;letter-spacing:.2px}
.header-center p{font-size:.73rem;opacity:.65;margin-top:.2rem}
.header-right{text-align:right;font-size:.71rem;opacity:.6;white-space:nowrap}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?
   TAB BAR
�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
.tab-bar{
  background:#fff;border-bottom:2px solid var(--grey-200);
  display:flex;align-items:center;padding:0 1.25rem;
  flex-shrink:0;box-shadow:var(--shadow-sm);
  position:sticky;top:0;z-index:50;gap:.25rem;
}
.tab{
  padding:.78rem 1rem;border:none;background:none;cursor:pointer;
  font-size:.83rem;font-weight:600;color:var(--grey-500);
  border-bottom:3px solid transparent;margin-bottom:-2px;
  transition:color .15s,border-color .15s;white-space:nowrap;
}
.tab:hover{color:var(--blue-700)}
.tab.active{color:var(--blue-800);border-bottom-color:var(--blue-600)}
.tab-spacer{flex:1}
.tab-actions{display:flex;gap:.5rem;align-items:center}
.tab-action{
  padding:.42rem .9rem;border-radius:6px;cursor:pointer;
  font-size:.78rem;font-weight:600;transition:all .15s;
  display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap;
}
.tab-action.print-btn{background:#f0f9ff;color:#0369a1;border:1px solid #bae6fd}
.tab-action.print-btn:hover{background:#e0f2fe}
.tab-action.pdf-btn{background:#fdf4ff;color:#7e22ce;border:1px solid #e9d5ff}
.tab-action.pdf-btn:hover{background:#f3e8ff}
.tab-action.lock-btn-sm{background:#fef2f2;color:var(--crit);border:1px solid #fecaca}
.tab-action.lock-btn-sm:hover{background:#fee2e2}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?
   MAIN
�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
.main-content{flex:1;padding:1.25rem 1.5rem;max-width:1500px;margin:0 auto;width:100%}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?
   CARDS
�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:1.25rem}
.card-header{padding:.9rem 1.25rem;border-bottom:1px solid var(--grey-100);display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:.95rem;color:var(--blue-800)}
.card-body{padding:1.25rem}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?
   LÉGENDE & STATS
�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
.legend-grid{display:flex;flex-wrap:wrap;gap:.65rem;margin-bottom:.9rem}
.lv-item{display:flex;align-items:center;gap:.65rem;background:var(--grey-50);border-radius:6px;padding:.5rem .85rem;border:1px solid var(--grey-200)}
.lv-badge{width:34px;height:34px;border-radius:7px;color:#fff;font-size:1.15rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.lv-badge.l0{background:var(--lv0)}.lv-badge.l1{background:var(--lv1)}.lv-badge.l2{background:var(--lv2)}.lv-badge.l3{background:var(--lv3)}
.lv-text strong{display:block;font-size:.81rem;color:var(--grey-800)}
.lv-text small{font-size:.7rem;color:var(--grey-500)}
.alert-legend{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:.65rem}
.al-item{padding:.4rem .85rem;border-radius:5px;font-size:.78rem;font-weight:600;display:flex;align-items:center;gap:.35rem}
.al-item.danger{background:var(--red-light);color:#7b1a12;border:1px solid #f1aaa5}
.al-item.good{background:#d4edda;color:#155724;border:1px solid #c3e6cb}
.legend-hint{font-size:.74rem;color:var(--grey-400);font-style:italic}

.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem;margin-bottom:1.25rem}
.stat-card{background:#fff;border-radius:var(--radius);padding:.85rem 1rem;box-shadow:var(--shadow-sm);border-top:4px solid var(--blue-600);text-align:center}
.stat-card.danger{border-top-color:var(--crit)}.stat-card.ok{border-top-color:var(--ok)}
.stat-val{font-size:1.75rem;font-weight:800;color:var(--blue-800);line-height:1}
.stat-card.danger .stat-val{color:var(--crit)}.stat-card.ok .stat-val{color:var(--ok)}
.stat-lbl{font-size:.68rem;color:var(--grey-500);margin-top:.2rem}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?
   MATRIX TABLE
�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
/* Le conteneur scroll gère horizontal ET vertical → sticky thead fonctionne */
.matrix-scroll{
  overflow:auto;
  max-height:calc(100vh - 400px);
  min-height:260px;
}
.matrix-table{border-collapse:collapse;font-size:13px}
.corner-th{
  background:var(--blue-900);color:#fff;padding:.85rem 1rem;
  position:sticky;left:0;top:0;z-index:40;
  border-right:3px solid var(--blue-600);border-bottom:3px solid var(--blue-600);
  min-width:220px;vertical-align:middle;font-size:.8rem;font-weight:700;
  box-shadow:3px 3px 6px rgba(0,0,0,.15);
}
/* ── Ligne 1 du thead : en-têtes de CATÉGORIE (spanning) ── */
.cat-th{
  color:#fff;text-align:center;vertical-align:middle;
  position:sticky;top:0;z-index:21;
  padding:.5rem .75rem;font-size:.76rem;font-weight:800;letter-spacing:.3px;
  border-right:2px solid rgba(255,255,255,.25);
  border-bottom:1px solid rgba(255,255,255,.2);
  height:42px;white-space:nowrap;
}
.cat-th-none{background:var(--grey-600,#6c757d)}
/* ── Ligne 2 du thead : en-têtes de COMPÉTENCE ── */
.comp-th{
  color:#fff;
  padding:.65rem .5rem;text-align:center;vertical-align:middle;
  position:sticky;top:42px;z-index:20;   /* top = hauteur fixe de cat-th */
  border-right:1px solid rgba(255,255,255,.2);border-bottom:3px solid rgba(0,0,0,.2);
  min-width:130px;width:130px;
}
.comp-th-txt{
  font-size:.74rem;font-weight:600;display:block;
  line-height:1.4;white-space:normal;word-break:break-word;text-align:center;
}
.poly-th{
  background:var(--blue-900);color:#fff;
  position:sticky;top:0;z-index:22;
  padding:.65rem .6rem;text-align:center;vertical-align:middle;
  border-left:3px solid var(--blue-400);border-bottom:3px solid var(--blue-400);
  min-width:100px;
}
.poly-th-txt{font-size:.74rem;font-weight:700;display:block;line-height:1.4;text-align:center}
.emp-td{
  background:#fff;position:sticky;left:0;z-index:10;
  padding:.6rem 1rem;border-right:3px solid var(--grey-200);
  border-bottom:1px solid var(--grey-100);
  min-width:210px;box-shadow:3px 0 6px rgba(0,0,0,.06);
}
.emp-name-cell{font-weight:700;font-size:.84rem;color:var(--blue-800)}
.emp-role-cell{font-size:.7rem;color:var(--grey-500);font-style:italic}
tbody tr:nth-child(even) .emp-td{background:#fafbfd}
tbody tr:nth-child(even) .skill-cell{filter:brightness(.97)}
.skill-cell{
  text-align:center;vertical-align:middle;cursor:pointer;
  user-select:none;width:130px;height:62px;
  border-right:1px solid var(--grey-200);border-bottom:1px solid var(--grey-100);
  transition:filter .1s,transform .1s,box-shadow .1s;
}
.skill-cell:hover{filter:brightness(.8)!important;transform:scale(1.09);z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.skill-cell:active{transform:scale(.96)}
.skill-cell[data-l="0"]{background:var(--lv0)}
.skill-cell[data-l="1"]{background:var(--lv1)}
.skill-cell[data-l="2"]{background:var(--lv2)}
.skill-cell[data-l="3"]{background:var(--lv3)}
.sk-num{color:#fff;font-size:1.35rem;font-weight:800;display:block;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.sk-lbl{color:rgba(255,255,255,.82);font-size:.56rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;display:block;margin-top:.1rem}
.poly-td{
  text-align:center;vertical-align:middle;
  border-left:3px solid var(--grey-200);border-bottom:1px solid var(--grey-100);
  padding:.35rem;background:#eff6ff;
}
.poly-num{font-size:1.1rem;font-weight:800;color:var(--blue-700)}
.poly-over{font-size:.65rem;color:var(--grey-500)}
tfoot td{border-top:3px solid var(--grey-800)}
.redund-label-td{
  background:var(--grey-800);color:#fff;font-size:.7rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;text-align:left;
  padding:.7rem 1rem;position:sticky;left:0;z-index:10;
  box-shadow:3px 0 6px rgba(0,0,0,.15);line-height:1.4;
}
.redund-val-td{text-align:center;font-weight:800;font-size:1.05rem;padding:.45rem .25rem;border-right:1px solid rgba(255,255,255,.2)}
.redund-val-td.crit{background:var(--crit);color:#fff}
.redund-val-td.safe{background:var(--ok);color:#fff}
.r-sub{font-size:.6rem;font-weight:500;opacity:.85;display:block}
.redund-corner{background:var(--blue-900);color:#fff}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?
   COULEURS MÉTIERS & COMPÉTENCES
�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
/* Barre colorée gauche par métier */
.emp-td-inner{display:flex;align-items:center;gap:.6rem}
.role-bar{width:5px;border-radius:3px;flex-shrink:0;align-self:stretch;min-height:36px}
/* Légende des métiers dans la matrice */
.role-legend-wrap{padding:.6rem 0 .2rem}
.role-legend-title{font-size:.78rem;font-weight:700;color:var(--grey-600,#555);margin-bottom:.5rem}
.role-legend-grid{display:flex;flex-wrap:wrap;gap:.45rem}
.role-legend-item{
  display:inline-flex;align-items:center;gap:.45rem;
  padding:.35rem .75rem;border-radius:6px;font-size:.78rem;font-weight:600;
  border:1.5px solid transparent;cursor:pointer;transition:filter .15s;
  user-select:none;
}
.role-legend-item:hover{filter:brightness(.9)}
.role-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(0,0,0,.15)}
/* Swatch couleur dans le tableau de gestion */
.color-swatch{
  width:22px;height:22px;border-radius:5px;display:inline-block;
  border:1.5px solid rgba(0,0,0,.2);vertical-align:middle;cursor:pointer;
}
/* Input color natif caché mais stylé */
input[type=color]{width:36px;height:30px;border:none;border-radius:6px;cursor:pointer;padding:2px;background:none}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?
   MANAGEMENT
�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
.view-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.view-toolbar h2{font-size:1rem;font-weight:700;color:var(--blue-800)}
.mgmt-table{width:100%;border-collapse:collapse;font-size:.87rem}
.mgmt-table th{background:var(--grey-50);border-bottom:2px solid var(--grey-200);padding:.6rem .9rem;text-align:left;font-weight:700;color:var(--grey-700);white-space:nowrap}
.mgmt-table td{padding:.65rem .9rem;border-bottom:1px solid var(--grey-100);vertical-align:middle}
.mgmt-table tr:last-child td{border-bottom:none}
.mgmt-table tr:hover td{background:var(--grey-50)}

/* �?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?
   BUTTONS
�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.48rem .95rem;border:none;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .14s;white-space:nowrap}
.btn-primary{background:var(--blue-600);color:#fff}.btn-primary:hover{background:var(--blue-700)}

const ACCESS_CODE = 'Def2026';

function checkCode(){
  const val = document.getElementById('code-input').value;
  const inp = document.getElementById('code-input');
  const err = document.getElementById('lock-error');
  if(val === ACCESS_CODE){
    sessionStorage.setItem('def_auth','1');
    document.getElementById('lock-screen').style.display='none';
    document.getElementById('app-shell').style.display='flex';
    err.textContent='';
  } else {
    inp.classList.remove('shake');
    void inp.offsetWidth; // reflow pour relancer l'animation
    inp.classList.add('shake');
    err.textContent='�?� Code incorrect. Veuillez réessayer.';
    inp.value='';
    inp.focus();
    setTimeout(()=>inp.classList.remove('shake'),450);
  }
}

  else{inp.type='password';btn.textContent='�?';}
}

  sessionStorage.removeItem('def_auth');
  document.getElementById('app-shell').style.display='none';
  document.getElementById('lock-screen').style.display='flex';
  document.getElementById('code-input').value='';
  document.getElementById('lock-error').textContent='';

let config, comps, emps, skills;
const KEY = 'def_polyvalence_v4';

function load(){
  try{
    const s=localStorage.getItem(KEY);
    if(s){
      const d=JSON.parse(s);
      config=d.config; comps=d.comps; emps=d.emps; skills=d.skills;
      // Migration : ajouter les catégories si absentes
      if(!config.categories) config.categories=JSON.parse(JSON.stringify(DEFAULTS.config.categories));
      if(!config.roleColors)  config.roleColors={};
      DEFAULTS.config.categories.forEach(dc=>{
        if(!config.categories.find(c=>c.id===dc.id)) config.categories.push(JSON.parse(JSON.stringify(dc)));
      });
      DEFAULTS.comps.forEach(dc=>{
        if(!comps.find(c=>c.id===dc.id)){comps.push(JSON.parse(JSON.stringify(dc)));emps.forEach(e=>{if(!skills[e.id])skills[e.id]={};skills[e.id][dc.id]=0;});}
      });
      // Migration : comps avec color mais sans categoryId → catégorie par défaut
      comps.forEach(c=>{ if(!c.categoryId && c.color) delete c.color; });
      return;
    }
  }catch(e){}
  resetToDefaults(false);
}

function save(){
  localStorage.setItem(KEY,JSON.stringify({config,comps,emps,skills}));
  const now=new Date().toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
  localStorage.setItem(KEY+'_ts',now);
  const el=document.getElementById('last-update');
  if(el) el.textContent=now;
  saveToFolder();
}

�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�?�? */
const IDB_NAME='def_poly_fs', IDB_STORE='handles', IDB_KEY='backupDir';

function openIDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess=e=>res(e.target.result);
    req.onerror=e=>rej(e.target.error);
  });
}

async function getStoredHandle(){
  try{
    const db=await openIDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction(IDB_STORE,'readonly');
      const req=tx.objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess=e=>res(e.target.result||null);
      req.onerror=e=>rej(e.target.error);
    });
  }catch(e){return null;}
}

async function storeHandle(handle){
  try{
    const db=await openIDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(handle,IDB_KEY);
      tx.oncomplete=()=>res();
      tx.onerror=e=>rej(e.target.error);
    });
  }catch(e){}
}

async function saveToFolder(){
  try{
    const handle=await getStoredHandle();
    if(!handle) return;
    const perm=await handle.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){
      const req=await handle.requestPermission({mode:'readwrite'});
      if(req!=='granted') return;
    }
    const fname=`polyvalence_${(config?.company||'backup').replace(/\s+/g,'_')}.json`;
    const fh=await handle.getFileHandle(fname,{create:true});
    const w=await fh.createWritable();
    await w.write(JSON.stringify({config,comps,emps,skills},null,2));
    await w.close();
    updateFolderStatus(handle.name,'✅ Sauvegardé dans : ');
  }catch(e){
    if(e.name!=='NotAllowedError') console.warn('saveToFolder:',e);
  }
}

async function chooseBackupFolder(){
  if(!('showDirectoryPicker' in window)){
    alert('Votre navigateur ne supporte pas cette fonctionnalité.\nUtilisez Chrome ou Edge.');
    return;
  }
  try{
    const handle=await window.showDirectoryPicker({mode:'readwrite',id:'def_poly_backup'});
    await storeHandle(handle);
    updateFolderStatus(handle.name,'✅ Dossier sélectionné : ');
    await saveToFolder();

function getCompsByCat(){
  const cats=config.categories||[];

  cats.forEach(cat=>{
    const cc=comps.filter(c=>c.categoryId===cat.id);
    if(cc.length) groups.push({cat,comps:cc});
  });
  // Compétences sans catégorie
  const orphans=comps.filter(c=>!c.categoryId||!getCategory(c.categoryId));
  if(orphans.length) groups.push({cat:{id:'none',name:'Sans catégorie',color:'#6c757d'},comps:orphans});
  return groups;
}

const LVL_LABEL=['Non formé','Formation','Autonome','Expert'];

function skillOf(eId,cId){return((skills[eId]||{})[cId])||0;}
function getPolyvalence(eId){return comps.filter(c=>skillOf(eId,c.id)>=2).length;}
function getRedundancy(cId){return emps.filter(e=>skillOf(e.id,cId)>=2).length;}

function getStats(){
  const total=emps.length*comps.length;
  const cov=emps.reduce((s,e)=>s+comps.filter(c=>skillOf(e.id,c.id)>=2).length,0);
  const crits=comps.filter(c=>getRedundancy(c.id)<=1).length;
  const safe=comps.filter(c=>getRedundancy(c.id)>=2).length;
  const avgPoly=emps.length?(emps.reduce((s,e)=>s+getPolyvalence(e.id),0)/emps.length).toFixed(1):'0';
  return{total,cov,crits,safe,avgPoly,pct:total?Math.round(cov/total*100):0};
}

function cycleSkill(eId,cId){
  if(!skills[eId])skills[eId]={};
  skills[eId][cId]=((skills[eId][cId]||0)+1)%4;
  save();

  const lvl=skills[eId][cId];

  // ── Cellule cliquée ──
  const cell=document.getElementById('sc-'+eId+'-'+cId);
  if(cell){
    cell.setAttribute('data-l',lvl);
    cell.querySelector('.sk-num').textContent=lvl;
    cell.querySelector('.sk-lbl').textContent=LVL_LABEL[lvl];
    const emp=emps.find(e=>e.id===eId)||{};
    const comp=comps.find(c=>c.id===cId)||{};
    cell.title=(emp.name||'')+'\n'+(comp.name||'')+'\nNiveau : '+lvl+' — '+LVL_LABEL[lvl];
  }

  // ── Polyvalence de la ligne ──
  const polyCell=document.getElementById('poly-'+eId);
  if(polyCell){
    const poly=getPolyvalence(eId);
    const pct=comps.length?Math.round(poly/comps.length*100):0;
    const pc=poly>=comps.length*.7?'var(--ok)':poly>=comps.length*.4?'#b7770d':'var(--crit)';
    polyCell.innerHTML=`<div class="poly-num" style="color:${pc}">${poly}</div><div class="poly-over">/ ${comps.length} (${pct}%)</div>`;
  }

  // ── Redondance de la colonne ──
  const redundCell=document.getElementById('redund-'+cId);
  if(redundCell){
    const r=getRedundancy(cId);
    redundCell.className='redund-val-td '+(r<=1?'crit':'safe');
    redundCell.title=(comps.find(c=>c.id===cId)||{}).name+' — Redondance : '+r;
    redundCell.innerHTML=(r<=1?'⚠ '+r:r)+'<span class="r-sub">'+(r<=1?'CRITIQUE':'Sécurisé')+'</span>';
  }
}

function renderMatrix(){
  const s=getStats();
  let html=`
  <div class="card">
    <div class="card-header">📋 Légende — Échelle ILUO &amp; Indicateurs QHSE</div>
    <div class="card-body">
      <div class="legend-grid">
        <div class="lv-item"><span class="lv-badge l0">0</span><div class="lv-text"><strong>Non formé</strong><small>Aucune compétence sur ce poste</small></div></div>
        <div class="lv-item"><span class="lv-badge l1">1</span><div class="lv-text"><strong>En formation / Sous supervision</strong><small>Nécessite un tuteur</small></div></div>
        <div class="lv-item"><span class="lv-badge l2">2</span><div class="lv-text"><strong>Autonome</strong><small>Tient le poste seul</small></div></div>
        <div class="lv-item"><span class="lv-badge l3">3</span><div class="lv-text"><strong>Expert / Référent</strong><small>Peut former les pairs</small></div></div>
      </div>
      <div class="alert-legend">
        <div class="al-item danger">🔴 Redondance ≤ 1 : <strong>RISQUE CRITIQUE</strong> — continuité non garantie</div>
        <div class="al-item good">🟢 Redondance ≥ 2 : <strong>PROCESSUS SÉCURISÉ</strong> — couverture suffisante</div>
      </div>
      <div class="legend-hint">💡 Cliquez sur une cellule pour faire évoluer le niveau (0 → 1 → 2 → 3 → 0). Sauvegarde automatique.</div>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val">${emps.length}</div><div class="stat-lbl">Collaborateurs</div></div>
    <div class="stat-card"><div class="stat-val">${comps.length}</div><div class="stat-lbl">Compétences critiques</div></div>
    <div class="stat-card ${s.crits>0?'danger':'ok'}"><div class="stat-val">${s.crits}</div><div class="stat-lbl">En risque critique</div></div>
    <div class="stat-card ok"><div class="stat-val">${s.safe}</div><div class="stat-lbl">Sécurisée(s)</div></div>
    <div class="stat-card"><div class="stat-val">${s.avgPoly}<small style="font-size:1rem;color:var(--grey-400)">/${comps.length}</small></div><div class="stat-lbl">Polyvalence moyenne</div></div>
    <div class="stat-card ${s.pct>=60?'ok':'danger'}"><div class="stat-val">${s.pct}%</div><div class="stat-lbl">Couverture globale ≥ 2</div></div>
  </div>`;

  if(!emps.length||!comps.length){
    html+=`<div class="card"><div class="card-body"><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-txt">Ajoutez des collaborateurs et des compétences via les onglets.</div></div></div></div>`;
    document.getElementById('main-content').innerHTML=html;return;
  }

  // ── Légende des métiers (cliquable pour changer la couleur) ──
  const uniqueRoles=[...new Set(emps.map(e=>e.role))].sort();
  uniqueRoles.forEach(r=>getRoleColor(r)); // s'assurer que chaque rôle a une couleur
  const roleLegendItems=uniqueRoles.map(r=>{
    const col=getRoleColor(r);
    const rgb=hexToRgb(col);
    return`<span class="role-legend-item"
      style="background:rgba(${rgb},.12);border-color:rgba(${rgb},.35);color:${col}"
      title="Cliquer pour changer la couleur du métier : ${r}">
      <span class="role-dot" style="background:${col}"></span>
      ${esc(r)}
      <input type="color" value="${col}" style="opacity:0;width:0;height:0;position:absolute"
        id="rc-${btoa(r).replace(/=/g,'')}"
        oninput="setRoleColor('${esc(r)}',this.value)">
      <span onclick="document.getElementById('rc-${btoa(r).replace(/=/g,'')}').click()" style="font-size:.65rem;opacity:.6;margin-left:.2rem">✎</span>
    </span>`;
  }).join('');

  html+=`<div class="card" style="margin-bottom:.9rem">
    <div class="card-header" style="padding:.7rem 1.25rem;font-size:.85rem">
      🎨 Légende des Métiers
      <span style="font-size:.72rem;color:var(--grey-400);font-weight:400">Cliquez sur ✎ pour changer la couleur d'un métier</span>
    </div>
    <div class="card-body" style="padding:.75rem 1.25rem">
      <div class="role-legend-grid">${roleLegendItems||'<span style="color:var(--grey-400);font-size:.8rem">Aucun métier défini.</span>'}</div>
    </div>
  </div>`;

  // ── Thead 2 lignes : ligne 1 = catégories (spanning), ligne 2 = compétences ──
  const groups=getCompsByCat();
  // Ligne 1 : coin + catégories + poly
  let thead=`<thead><tr>
    <th class="corner-th" rowspan="2">Collaborateur / Compétence</th>`;
  groups.forEach(g=>{
    thead+=`<th class="cat-th" colspan="${g.comps.length}" style="background:${g.cat.color}">${esc(g.cat.name)}</th>`;
  });
  thead+=`<th class="poly-th" rowspan="2"><span class="poly-th-txt">Indice de Polyvalence</span></th></tr>`;
  // Ligne 2 : compétences individuelles colorées par catégorie
  thead+=`<tr>`;
  groups.forEach(g=>{
    g.comps.forEach(c=>{
      thead+=`<th class="comp-th" style="background:${g.cat.color}" title="${esc(c.name)}">
        <span class="comp-th-txt">${esc(c.name)}</span>
      </th>`;
    });
  });
  thead+=`</tr></thead>`;
  // Ordre plat des comps pour les cellules (respecte l'ordre des groupes)
  const orderedComps=groups.flatMap(g=>g.comps);

  // ── Tbody avec couleur de ligne par métier ──
  let tbody='<tbody>';
  emps.forEach(e=>{
    const poly=getPolyvalence(e.id);
    const pct=comps.length?Math.round(poly/comps.length*100):0;
    const pc=poly>=comps.length*.7?'var(--ok)':poly>=comps.length*.4?'#b7770d':'var(--crit)';
    const roleCol=getRoleColor(e.role);
    const rgb=hexToRgb(roleCol);
    tbody+=`<tr style="background:rgba(${rgb},.06)">
      <td class="emp-td" style="background:rgba(${rgb},.06)">
        <div class="emp-td-inner">
          <div class="role-bar" style="background:${roleCol}"></div>
          <div>
            <div class="emp-name-cell">${e.name}</div>
            <div class="emp-role-cell" style="color:${roleCol}">${e.role}</div>
          </div>
        </div>
      </td>`;
    orderedComps.forEach(c=>{
      const lvl=skillOf(e.id,c.id);
      tbody+=`<td id="sc-${e.id}-${c.id}" class="skill-cell" data-l="${lvl}" onclick="cycleSkill('${e.id}','${c.id}')" title="${e.name}\n${c.name}\nNiveau : ${lvl} — ${LVL_LABEL[lvl]}">
        <span class="sk-num">${lvl}</span><span class="sk-lbl">${LVL_LABEL[lvl]}</span></td>`;
    });
    tbody+=`<td id="poly-${e.id}" class="poly-td"><div class="poly-num" style="color:${pc}">${poly}</div><div class="poly-over">/ ${comps.length} (${pct}%)</div></td></tr>`;
  });
  tbody+='</tbody>';

  let tfoot=`<tfoot><tr><td class="redund-label-td">📊 Taux de Redondance<br><small style="font-weight:400;opacity:.75">nb. personnes niveau ≥ 2</small></td>`;
  orderedComps.forEach(c=>{
    const r=getRedundancy(c.id);
    tfoot+=`<td id="redund-${c.id}" class="redund-val-td ${r<=1?'crit':'safe'}" title="${c.name} — Redondance : ${r}">${r<=1?'⚠ '+r:r}<span class="r-sub">${r<=1?'CRITIQUE':'Sécurisé'}</span></td>`;
  });
  tfoot+=`<td class="redund-val-td redund-corner">—</td></tr></tfoot>`;

  html+=`<div class="card">
    <div class="card-header">Matrice interactive — ${emps.length} collaborateur(s) × ${comps.length} compétence(s)</div>
    <div class="matrix-scroll"><table class="matrix-table">${thead}${tbody}${tfoot}</table></div>
  </div>`;
  document.getElementById('main-content').innerHTML=html;
}

function renderEmployees(){
  let rows=emps.length?emps.map((e,i)=>{
    const poly=getPolyvalence(e.id);
    return`<tr>
      <td style="width:32px;color:var(--grey-400);font-size:.75rem;text-align:center">${i+1}</td>
      <td><strong>${e.name}</strong></td>
      <td style="color:var(--grey-500);font-style:italic">${e.role}</td>
      <td><span class="badge badge-blue">${poly} / ${comps.length} compétences ≥ 2</span></td>
      <td><div class="btn-group">
        <button class="btn btn-secondary btn-sm" onclick="openEditEmployee('${e.id}')">�?�? Modifier</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDeleteEmployee('${e.id}')">🗑 Supprimer</button>
      </div></td></tr>`;
  }).join(''):`<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">👥</div><div class="empty-txt">Aucun collaborateur.</div></div></td></tr>`;

  document.getElementById('main-content').innerHTML=`
    <div class="view-toolbar"><h2>👥 Collaborateurs</h2>
      <button class="btn btn-primary" onclick="openAddEmployee()">+ Ajouter un collaborateur</button></div>
    <div class="card"><div class="card-body" style="padding:0">
      <table class="mgmt-table">
        <thead><tr><th>#</th><th>Nom</th><th>Fonction</th><th>Polyvalence</th><th>Actions</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div>
    <p style="font-size:.75rem;color:var(--grey-400);margin-top:.5rem">💡 Rendez-vous dans <strong>Matrice</strong> pour renseigner les niveaux de compétence.</p>`;
}

function openAddEmployee(){
  openModal('Ajouter un collaborateur',`
    <div class="form-group"><label class="form-label">Nom complet *</label>
      <input class="form-control" id="f-name" placeholder="ex : Jean DUPONT" autocomplete="off"></div>
    <div class="form-group"><label class="form-label">Fonction / Rôle *</label>
      <input class="form-control" id="f-role" placeholder="ex : Technicien SSI" list="rl" autocomplete="off">
      <datalist id="rl">${[...new Set(emps.map(e=>e.role))].map(r=>`<option value="${r}">`).join('')}</datalist></div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="addEmployee()">✅ Ajouter</button></div>`);
}

function addEmployee(){
  const name=document.getElementById('f-name').value.trim();
  const role=document.getElementById('f-role').value.trim();
  if(!name){alert('Le nom est obligatoire.');return;}
  if(!role){alert('La fonction est obligatoire.');return;}
  const id=uid(); emps.push({id,name,role});
  skills[id]={}; comps.forEach(c=>{skills[id][c.id]=0;});
  save();closeModal();renderEmployees();showToast('✅ Collaborateur ajouté.');
}

function openEditEmployee(id){
  const e=emps.find(x=>x.id===id); if(!e)return;
  openModal('Modifier le collaborateur',`
    <div class="form-group"><label class="form-label">Nom complet *</label>
      <input class="form-control" id="f-name" value="${esc(e.name)}" autocomplete="off"></div>
    <div class="form-group"><label class="form-label">Fonction / Rôle *</label>
      <input class="form-control" id="f-role" value="${esc(e.role)}" list="rl2" autocomplete="off">
      <datalist id="rl2">${[...new Set(emps.map(x=>x.role))].map(r=>`<option value="${r}">`).join('')}</datalist></div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveEmployee('${id}')">💾 Enregistrer</button></div>`);
}

function saveEmployee(id){
  const e=emps.find(x=>x.id===id); if(!e)return;
  const name=document.getElementById('f-name').value.trim();
  const role=document.getElementById('f-role').value.trim();
  if(!name||!role){alert('Nom et fonction requis.');return;}
  e.name=name;e.role=role;save();closeModal();renderEmployees();showToast('✅ Modifications enregistrées.');
}

function confirmDeleteEmployee(id){
  const e=emps.find(x=>x.id===id); if(!e)return;
  openModal('Confirmer la suppression',`
    <p style="margin-bottom:1rem">Supprimer <strong>${esc(e.name)}</strong> ? Toutes ses données de compétences seront perdues.</p>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-danger" onclick="deleteEmployee('${id}')">🗑 Supprimer définitivement</button></div>`);
}

function deleteEmployee(id){
  emps=emps.filter(e=>e.id!==id);delete skills[id];
  save();closeModal();renderEmployees();showToast('🗑 Collaborateur supprimé.');
}

function renderComps(){
  let rows=comps.length?comps.map((c,i)=>{
    const r=getRedundancy(c.id);
    const cls=r<=1?'badge-red':'badge-green';
    const cat=getCategory(c.categoryId);
    const catColor=cat?cat.color:'#6c757d';
    const catName=cat?cat.name:'Sans catégorie';
    return`<tr>
      <td style="width:32px;color:var(--grey-400);font-size:.75rem;text-align:center">${i+1}</td>
      <td><strong>${esc(c.name)}</strong></td>
      <td><span class="badge ${cls}">${r<=1?'⚠ '+r+' — CRITIQUE':'✓ '+r+' — Sécurisé'}</span></td>
      <td>
        <span style="display:inline-flex;align-items:center;gap:.4rem;padding:.25rem .6rem;border-radius:20px;font-size:.75rem;font-weight:600;color:#fff;background:${catColor}">
          <span style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);display:inline-block"></span>
          ${esc(catName)}
        </span>
      </td>
      <td><div class="btn-group">
        <button class="btn btn-secondary btn-sm" onclick="openEditComp('${c.id}')">�?�? Modifier</button>
        <button class="btn btn-danger btn-sm" onclick="confirmDeleteComp('${c.id}')">🗑 Supprimer</button>
      </div></td></tr>`;
  }).join(''):`<tr><td colspan="5"><div class="empty-state"><div class="empty-icon">⚡</div><div class="empty-txt">Aucune compétence.</div></div></td></tr>`;

  document.getElementById('main-content').innerHTML=`
    <div class="view-toolbar"><h2>⚡ Compétences Critiques</h2>
      <button class="btn btn-primary" onclick="openAddComp()">+ Ajouter une compétence</button></div>
    <div class="card"><div class="card-body" style="padding:0">
      <table class="mgmt-table">
        <thead><tr><th>#</th><th>Nom de la compétence</th><th>Taux de Redondance</th><th>Catégorie</th><th>Actions</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div></div>
    <p style="font-size:.75rem;color:var(--grey-400);margin-top:.5rem">💡 Supprimer une compétence efface tous les niveaux associés dans la matrice.</p>`;
}

function openAddComp(){
  const firstCatId=(config.categories&&config.categories.length)?config.categories[0].id:'';
  openModal('Ajouter une compétence',`
    <div class="form-group"><label class="form-label">Nom de la compétence *</label>
      <input class="form-control" id="f-cname" placeholder="ex : Maintenance Préventive" autocomplete="off">
      <div class="form-hint">Ce nom apparaîtra en en-tête de colonne dans la matrice.</div></div>
    <div class="form-group">
      <label class="form-label">Catégorie</label>
      <select class="form-control" id="f-catid">${catSelectOptions(firstCatId)}</select>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="addComp()">✅ Ajouter</button></div>`);
}

function addComp(){
  const name=document.getElementById('f-cname').value.trim();
  const categoryId=document.getElementById('f-catid').value||'';
  if(!name){alert('Le nom est obligatoire.');return;}
  const id=uid(); comps.push({id,name,categoryId});
  emps.forEach(e=>{if(!skills[e.id])skills[e.id]={};skills[e.id][id]=0;});
  save();closeModal();renderComps();showToast('✅ Compétence ajoutée.');
}

function openEditComp(id){
  const c=comps.find(x=>x.id===id); if(!c)return;
  openModal('Modifier la compétence',`
    <div class="form-group"><label class="form-label">Nom de la compétence *</label>
      <input class="form-control" id="f-cname" value="${esc(c.name)}" autocomplete="off"></div>
    <div class="form-group">
      <label class="form-label">Catégorie</label>
      <select class="form-control" id="f-catid">${catSelectOptions(c.categoryId||'')}</select>
    </div>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveComp('${id}')">💾 Enregistrer</button></div>`);
}

function saveComp(id){
  const c=comps.find(x=>x.id===id); if(!c)return;
  const name=document.getElementById('f-cname').value.trim();
  const categoryId=document.getElementById('f-catid').value||c.categoryId||'';
  if(!name){alert('Le nom est obligatoire.');return;}
  c.name=name; c.categoryId=categoryId; delete c.color;
  save();closeModal();renderComps();showToast('✅ Modifications enregistrées.');
}

function confirmDeleteComp(id){
  const c=comps.find(x=>x.id===id); if(!c)return;
  openModal('Confirmer la suppression',`
    <p style="margin-bottom:1rem">Supprimer la compétence <strong>${esc(c.name)}</strong> ? Les niveaux de tous les collaborateurs pour cette compétence seront effacés.</p>
    <div class="form-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Annuler</button>
      <button class="btn btn-danger" onclick="deleteComp('${id}')">🗑 Supprimer définitivement</button></div>`);
}

function deleteComp(id){
  comps=comps.filter(c=>c.id!==id);
  emps.forEach(e=>{if(skills[e.id])delete skills[e.id][id];});
  save();closeModal();renderComps();showToast('🗑 Compétence supprimée.');
}

          <hr style="margin:.75rem 0;border-color:var(--grey-200)">
          <p style="font-size:.82rem;font-weight:600;margin-bottom:.4rem">�? Sauvegarde automatique dans un dossier</p>
          <p style="font-size:.78rem;color:var(--grey-500);margin-bottom:.75rem">Choisissez un dossier : à chaque modification, le fichier JSON sera mis à jour automatiquement. Fonctionne sur Chrome et Edge.</p>
          <div id="backup-folder-status" style="margin-bottom:.75rem;font-size:.82rem"><span style="color:var(--grey-500)">Aucun dossier configuré</span></div>
          <button class="btn btn-primary" onclick="chooseBackupFolder()">📂 Choisir le dossier de sauvegarde</button>
        </div></div></div>
      <div class="settings-section">
        <div class="settings-title">⚠�? Zone de danger</div>
        <div class="danger-zone">
          <div class="danger-title">Réinitialisation complète</div>
          <div class="danger-desc">Efface toutes vos données et restaure les données de démonstration. Irréversible.</div>
          <button class="btn btn-danger" onclick="resetToDefaults(true)">🔄 Réinitialiser avec les données de démo</button>
        </div></div>
    </div>`;
  initFolderStatus();
}

function saveConfig(){
  config.company=document.getElementById('s-company').value.trim()||config.company;
  config.companySub=document.getElementById('s-company-sub').value.trim();
  config.docTitle=document.getElementById('s-title').value.trim()||config.docTitle;
  config.docSub=document.getElementById('s-sub').value.trim();
  save();applyConfig();showToast('✅ Paramètres enregistrés.');
}

function exportData(){
  const blob=new Blob([JSON.stringify({config,comps,emps,skills},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`polyvalence_${(config.company||'export').replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();URL.revokeObjectURL(url);
  showToast('✅ Fichier exporté avec succès.');
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const d=JSON.parse(ev.target.result);
      if(!d.comps||!d.emps||!d.skills)throw new Error('Format invalide');
      config=d.config||config;comps=d.comps;emps=d.emps;skills=d.skills;
      save();applyConfig();showView('settings');showToast('✅ Données importées avec succès.');
    }catch(err){alert('�?� Erreur lors de l\'import : '+err.message);}
  };
  reader.readAsText(file);e.target.value='';
}
